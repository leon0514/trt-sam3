<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TRT SAM3 检测演示</title>
    <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
    <div class="container">
        <h1>🖼️ TRT SAM3 目标检测与分割</h1>
        <div class="main-grid">
            <div class="panel settings-panel" id="settingsPanel">
                <h3>参数设置</h3>
                <div class="settings-scroll">
                    <div class="form-group">
                        <label for="modeSelect">推理模式</label>
                        <select id="modeSelect">
                            <option value="multi-class">🔤 多类别文本提示</option>
                            <option value="box">📦 纯框提示</option>
                            <option value="mixed">🔤+📦 文本+框混合提示</option>
                            <option value="from-image">🖼️ 跨图参考提示</option>
                            <option value="obj-refine">🔍 目标细化 (obj-refine)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>目标图片</label>
                        <div class="drop-zone" id="dropZone">
                            点击选择或拖拽图片到此处
                            <input type="file" id="imageInput" accept="image/*" style="display:none">
                        </div>
                        <div id="targetThumbBox" class="thumb-box" style="display:none">
                            <img id="previewImage" class="thumb-image" alt="预览">
                            <div class="thumb-actions">
                                <button type="button" id="editTargetBoxesBtn" class="secondary">标注 Box</button>
                                <button type="button" id="reuploadTargetBtn" class="secondary">重新上传</button>
                            </div>
                            <div class="box-list" id="targetBoxList"></div>
                        </div>
                    </div>
                    <div class="form-group" id="promptImageGroup" style="display:none">
                        <label>参考图片（from-image）</label>
                        <div class="drop-zone" id="promptDropZone">
                            点击选择或拖拽参考图片到此处
                            <input type="file" id="promptImageInput" accept="image/*" style="display:none">
                        </div>
                        <div id="promptThumbBox" class="thumb-box" style="display:none">
                            <img id="promptPreviewImage" class="thumb-image" alt="参考图预览">
                            <div class="thumb-actions">
                                <button type="button" id="editPromptBoxesBtn" class="secondary">标注 Box</button>
                                <button type="button" id="reuploadPromptBtn" class="secondary">重新上传</button>
                            </div>
                            <div class="box-list" id="promptBoxList"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label id="tagInputLabel">识别标签（按 Enter 添加）</label>
                        <div class="tag-input" id="tagInput">
                            <div id="tagList"></div>
                            <input type="text" id="tagAdd" placeholder="输入标签后回车">
                        </div>
                        <div class="mode-hint" id="modeHint"></div>
                    </div>
                    <div class="form-group">
                        <label for="confidence">置信度阈值</label>
                        <input type="range" id="confidence" min="0" max="1" step="0.01" value="0.3">
                        <div class="range-value" id="confidenceValue">0.30</div>
                    </div>
                    <div class="form-group" id="predefinedLabelsGroup" style="display:none">
                        <label>预检测标签（按 Enter 添加，用于 obj-refine 定位裁剪区域）</label>
                        <div class="tag-input" id="predefinedTagInput">
                            <div id="predefinedTagList"></div>
                            <input type="text" id="predefinedTagAdd" placeholder="输入标签后回车">
                        </div>
                    </div>
                    <div class="form-group" id="mergeResultsGroup" style="display:none">
                        <div class="checkbox-row">
                            <input type="checkbox" id="mergeResults" checked>
                            <label for="mergeResults">合并原图与裁剪结果</label>
                        </div>
                    </div>
                    <div class="form-group" id="cropConfigGroup" style="display:none">
                        <div class="collapse-header" id="cropConfigToggle">
                            <span>⚙️ Omnicrop 高级配置</span>
                            <span>▼</span>
                        </div>
                        <div class="collapse-panel" id="cropConfigPanel" style="display:none">
                            <div class="field-row"><label>max_size</label><input type="number" id="cropMaxSize" value="640"></div>
                            <div class="field-row"><label>padding</label><input type="number" id="cropPadding" value="20"></div>
                            <div class="field-row"><label>w_diou</label><input type="number" id="cropWDiou" value="30"></div>
                            <div class="field-row"><label>w_expansion</label><input type="number" id="cropWExpansion" value="5"></div>
                            <div class="field-row"><label>count_penalty</label><input type="number" id="cropCountPenalty" value="120"></div>
                            <div class="field-row"><label>nms_threshold</label><input type="number" id="cropNmsThreshold" value="0.2" step="0.1"></div>
                            <div class="field-row"><label>target_ar</label><input type="number" id="cropTargetAr" value="1" step="0.1"></div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="cropEnableAr" checked>
                                <label for="cropEnableAr">enable_ar_fix</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>显示选项</label>
                        <div class="checkbox-row">
                            <input type="checkbox" id="showBoxes" checked>
                            <label for="showBoxes">显示检测框</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="showMasks" checked>
                            <label for="showMasks">显示分割 Mask</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="showLabels" checked>
                            <label for="showLabels">显示标签文字</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="returnMask" checked>
                            <label for="returnMask">后端返回 Mask</label>
                        </div>
                    </div>
                </div>
                <div class="settings-footer">
                    <button id="submitBtn">开始检测</button>
                    <div class="stats" id="stats"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3>检测结果</h3>
                    <button id="downloadBtn" class="download-fab" title="下载结果图">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                </div>
                <div id="resultContainer" style="display:none">
                    <div class="image-wrapper" id="imageWrapper">
                        <img id="sourceImage" alt="source">
                        <canvas id="overlayCanvas"></canvas>
                    </div>
                    <div class="legend" id="legend"></div>
                </div>
                <div id="placeholder" style="text-align:center;color:#94a3b8;padding:60px 0">
                    上传图片并点击“开始检测”查看结果
                </div>
                <div id="filterPanel" class="form-group" style="display:none">
                    <label>按标签筛选结果</label>
                    <div id="filterList"></div>
                    <div class="filter-actions">
                        <button type="button" id="selectAllBtn" class="secondary">☑ 全选</button>
                        <button type="button" id="selectNoneBtn" class="secondary">☐ 全不选</button>
                    </div>
                </div>
                <div id="scoreFilterPanel" class="form-group" style="display:none">
                    <label for="displayConfidence">展示置信度阈值（前端过滤）</label>
                    <input type="range" id="displayConfidence" min="0" max="1" step="0.01" value="0.0">
                    <div class="range-value" id="displayConfidenceValue">0.00</div>
                </div>
                <div id="areaFilterPanel" class="form-group" style="display:none">
                    <label for="minArea">最小面积（像素）</label>
                    <input type="number" id="minArea" min="0" step="1" value="0" placeholder="0">
                </div>
                <div class="json-panel">
                    <label>JSON 结果</label>
                    <textarea id="jsonOutput" readonly placeholder="检测结果 JSON 将显示在这里"></textarea>
                </div>
            </div>

            <div class="panel" id="resultListPanel" style="display:none">
                <h3>检测结果列表</h3>
                <div class="result-toolbar" style="display:flex; gap:8px; margin-bottom:10px;">
                    <button type="button" id="toggleShowChecked" class="secondary">只展示已勾选</button>
                    <button type="button" id="clearCheckedBtn" class="secondary" style="display:none">清除勾选</button>
                </div>
                <div class="sort-controls" style="margin-bottom:10px">
                    <select id="sortBy">
                        <option value="default">默认顺序</option>
                        <option value="area_desc">面积从大到小</option>
                        <option value="area_asc">面积从小到大</option>
                        <option value="score_desc">置信度从高到低</option>
                        <option value="score_asc">置信度从低到高</option>
                    </select>
                </div>
                <div id="detectionList"></div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <div id="editorModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editorTitle">标注 Box</h3>
                <button type="button" id="closeEditor" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="editor-canvas-wrapper">
                    <canvas id="editorCanvas"></canvas>
                </div>
                <div class="editor-tools">
                    <div class="radio-row">
                        <label><input type="radio" name="boxType" value="pos" checked> 正样本 (pos)</label>
                        <label><input type="radio" name="boxType" value="neg"> 负样本 (neg)</label>
                    </div>
                    <div class="editor-actions">
                        <button type="button" id="undoBoxBtn" class="secondary">撤销</button>
                        <button type="button" id="clearBoxesBtn" class="secondary">清空</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js?v=9"></script>
</body>
</html>
